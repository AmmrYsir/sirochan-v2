version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sirochan_app
    ports:
      - "4321:4321"
    environment:
      - DATABASE_URL=postgresql://sirochan:sirochan_secret@db:5432/sirochan_db?sslmode=disable
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    container_name: sirochan_postgres
    restart: always
    environment:
      POSTGRES_USER: sirochan
      POSTGRES_PASSWORD: sirochan_secret
      POSTGRES_DB: sirochan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirochan -d sirochan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
